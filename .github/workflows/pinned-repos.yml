name: Update pinned repositories

# Reads the repos pinned on the GitHub profile and saves them to data/pinned.json,
# which the portfolio's "Repositories" section displays.
on:
  schedule:
    - cron: '17 3 * * *'   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/pinned.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repositories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          gh api graphql -F login="$GH_USER" -f query='
            query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name
                      nameWithOwner
                      description
                      url
                      homepageUrl
                      stargazerCount
                      pushedAt
                      primaryLanguage { name }
                    }
                  }
                }
              }
            }' \
          | jq '[.data.user.pinnedItems.nodes[] | {
              name,
              fullName: .nameWithOwner,
              description,
              url,
              homepage: (.homepageUrl // ""),
              language: (.primaryLanguage.name // ""),
              stars: .stargazerCount,
              pushedAt
            }]' > data/pinned.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/pinned.json; then
            echo "No change in pinned repositories."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pinned.json
            git commit -m "chore: update pinned repositories"
            git push
          fi
